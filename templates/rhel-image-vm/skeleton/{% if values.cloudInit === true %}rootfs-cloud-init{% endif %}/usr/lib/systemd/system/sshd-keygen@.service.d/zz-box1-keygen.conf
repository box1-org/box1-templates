# box1-docs#140: cloud-init's ssh module does not run in this image, so sshd-keygen
# must still generate missing host keys. This resets the conditions, including
# cloud-init's disable-sshd-keygen-if-cloud-init-active.conf drop-in, and restores
# the stock condition of sshd-keygen@.service.
[Unit]
ConditionPathExists=
ConditionFileNotEmpty=|!/etc/ssh/ssh_host_%i_key
