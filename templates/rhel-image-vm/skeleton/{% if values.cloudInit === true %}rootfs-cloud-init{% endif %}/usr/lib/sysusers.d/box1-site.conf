# Service account for the instance's site services (box1-docs#140). cloud-init writes
# the machine credential /etc/box1/credentials/keycloak-client-secret as
# box1-site:box1-site, mode 0400; run services that need it with User=box1-site.
#Type Name      ID GECOS                     Home Shell
u     box1-site -  "Box1 site services"      -    /usr/sbin/nologin
