# Box1 golden path (box1-org/box1-templates, templates/rhel-image-vm, box1-docs#140).
# cloud-init here only delivers per-instance identity: /etc/box1/site.env and the
# instance's machine credential, written by write_files from a NoCloud disk that
# KubeVirt builds from the <instance>-cloud-init Secret (cloudInitNoCloud.secretRef).
# Everything else stays with the image and the platform:
#   - cloud-user and its SSH keys: the disk build and qemu-guest-agent accessCredentials;
#   - networking: NetworkManager DHCP on the KubeVirt pod network;
#   - OS updates: bootc (bootc-fetch-apply-updates.timer stays disabled);
#   - disks: nothing is partitioned, grown, formatted or mounted by cloud-init.
# Without a NoCloud disk cloud-init falls back to the None datasource and changes nothing.

# Never probe network metadata services.
datasource_list: [ NoCloud, None ]

# Leave the network configuration to NetworkManager.
network:
  config: disabled

# Manage no accounts: there is no default user, so no user, group, sudo rule,
# password or authorized key is created or changed by these modules.
users: []
ssh_pwauth: false
allow_public_ssh_keys: false
# KubeVirt supplies no vendor-data; refuse it anyway.
vendor_data:
  enabled: false

# Explicit module lists replace the distribution defaults: only write_files runs,
# on every boot, so a rotated Secret applies at the next VM restart without a new
# instance-id. Not run: ssh (it would install user-data ssh_authorized_keys and
# ssh_keys; host keys come from sshd-keygen, see sshd-keygen@.service.d), bootcmd,
# runcmd and scripts, users_groups and set_passwords, growpart, resizefs,
# disk_setup and mounts, set_hostname and update_etc_hosts, rh_subscription,
# yum_add_repo and package_update_upgrade_install (bootc owns packages).
# These lists limit what the image does with Box1-generated user-data. They are not
# a security boundary: user-data can override them, and boothooks and part-handlers
# run as root regardless. Write access to <instance>-cloud-init is root in the guest.
cloud_init_modules:
  - [ write_files, always ]
cloud_config_modules: []
cloud_final_modules: []
