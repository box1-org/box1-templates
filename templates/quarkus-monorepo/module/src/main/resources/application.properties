quarkus.application.name=${{ values.module }}
# Fast-jar (target/quarkus-app/), packaged as /${{ values.module }}/quarkus-app/ in the bundle.
quarkus.package.jar.type=fast-jar
# Modules run side by side in the consumer image: give each its own port at runtime.
quarkus.http.port=${HTTP_PORT:8080}
# Tests of different modules may run in parallel; use a random port.
quarkus.http.test-port=0
