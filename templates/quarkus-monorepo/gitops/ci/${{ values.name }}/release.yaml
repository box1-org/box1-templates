---
# Release identity of box1-org/${{ values.name }}: it pushes only to its own bundle
# ImageStream. Pull requests run as the shared ci-test account and publish nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "${{ values.name }}-release"
  namespace: box1-ci
---
# Declared so the release never needs rights to create image streams.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: "${{ values.name }}-bundle"
  namespace: box1-ci
spec:
  lookupPolicy:
    local: false
---
# Push to this one ImageStream only (system:image-builder would allow any in box1-ci).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "${{ values.name }}-bundle-push"
  namespace: box1-ci
rules:
- apiGroups:
  - ''
  - image.openshift.io
  resources:
  - imagestreams/layers
  resourceNames:
  - "${{ values.name }}-bundle"
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "${{ values.name }}-bundle-push"
  namespace: box1-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "${{ values.name }}-bundle-push"
subjects:
- kind: ServiceAccount
  name: "${{ values.name }}-release"
  namespace: box1-ci
