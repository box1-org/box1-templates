apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: ${{ values.name }}-push
  labels:
    backstage.io/kubernetes-id: ${{ values.name }}
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  timeouts:
    pipeline: 45m
  taskRunSpecs:
    - pipelineTaskName: promote
      serviceAccountName: gl-promote
  pipelineSpec:
    workspaces:
      - name: source
      - name: basic-auth
    tasks:
      - name: clone
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: git-clone}
            - {name: namespace, value: openshift-pipelines}
        params:
          - {name: URL, value: "{{ repo_url }}"}
          - {name: REVISION, value: "{{ revision }}"}
        workspaces:
          - {name: output, workspace: source}
          - {name: basic-auth, workspace: basic-auth}
      - name: test
        runAfter: [clone]
        workspaces:
          - {name: source, workspace: source}
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: unittest
              image: registry.access.redhat.com/ubi9/python-311@sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6
              workingDir: $(workspaces.source.path)
              script: python3 -m unittest -v
      - name: build
        runAfter: [test]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: buildah}
            - {name: namespace, value: openshift-pipelines}
        params:
          - {name: IMAGE, value: "image-registry.openshift-image-registry.svc:5000/box1-gl-ci/${{ values.name }}:{{ revision }}"}
          - {name: DOCKERFILE, value: ./Containerfile}
          - {name: BUILD_EXTRA_ARGS, value: "--build-arg=SOURCE_REVISION={{ revision }}"}
        workspaces:
          - {name: source, workspace: source}
      - name: promote
        runAfter: [build]
        taskRef:
          resolver: cluster
          params:
            - {name: kind, value: task}
            - {name: name, value: gitlab-gitops-promote}
            - {name: namespace, value: box1-gl-ci}
        params:
          - {name: application-name, value: ${{ values.name }}}
          - {name: revision, value: "{{ revision }}"}
          - {name: image-digest, value: "$(tasks.build.results.IMAGE_DIGEST)"}
          - {name: pipeline-run, value: "$(context.pipelineRun.name)"}
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
