# Booted-digest check (box1-docs#138): the onboarding verify runs the read-only Task
# box1-bootc-status as box1-ci/ci-vm-deploy. It uses `virtctl ssh` as guest user
# box1-status (from the source image; its key is forced to `bootc status --format json`)
# with the private key Secret box1-ci/vm-instance-status-ssh, created outside Git.
# This grants ci-vm-deploy only what `virtctl ssh` needs on this instance.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "${{ values.name }}-status-reader"
  namespace: "${{ values.namespace }}"
rules:
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachineinstances
  resourceNames:
  - "${{ values.name }}"
  verbs:
  - get
- apiGroups:
  - subresources.kubevirt.io
  resources:
  - virtualmachineinstances/portforward
  resourceNames:
  - "${{ values.name }}"
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "${{ values.name }}-status-reader"
  namespace: "${{ values.namespace }}"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "${{ values.name }}-status-reader"
subjects:
- kind: ServiceAccount
  name: ci-vm-deploy
  namespace: box1-ci
