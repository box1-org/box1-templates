apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: quarkus-rest-service
  title: Quarkus REST Service
  description: Java 21 REST service with tests, Jib, Tekton CI/CD, and OpenShift GitOps onboarding.
  tags: [quarkus, java, tekton, openshift, golden-path]
  annotations:
    box1.org/template-version: "1.0.0"
spec:
  owner: user:default/mike4263
  type: service
  parameters:
    - title: Service details
      required: [name, description, owner, visibility]
      properties:
        name:
          title: Service and repository name
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^(?!quarkus-reference$)(?!rhdh$)(?!default$)(?!box1-)(?!openshift-)(?!kube-)[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
          description: A unique lowercase name, used for the GitHub repository, namespace, image, and Route.
        description:
          title: Description
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z0-9][A-Za-z0-9 .,!?()/_-]*$'
          default: A Quarkus REST service on OpenShift
        owner:
          title: Catalog owner
          type: string
          default: user:default/mike4263
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        visibility:
          title: Repository visibility
          type: string
          enum: [private, public]
          default: private
  steps:
    - id: fetchApplication
      name: Generate application, tests, and pipelines
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: application
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
    - id: publish
      name: Create application repository
      action: publish:github
      input:
        repoUrl: github.com?owner=box1-org&repo=${{ parameters.name }}
        sourcePath: application
        description: ${{ parameters.description }}
        repoVisibility: ${{ parameters.visibility }}
        defaultBranch: main
        protectDefaultBranch: false
        deleteBranchOnMerge: true
        gitCommitMessage: Create Quarkus service from the Box1 golden path
        topics: [quarkus, box1-golden-path]
    - id: fetchGitops
      name: Generate GitOps onboarding configuration
      action: fetch:template
      input:
        url: ./gitops
        targetPath: gitops
        values:
          name: ${{ parameters.name }}
          sourceRevision: ${{ steps.publish.output.commitHash }}
    - id: onboarding
      name: Propose GitOps onboarding
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=box1-org&repo=box1-gitops
        branchName: onboard/${{ parameters.name }}
        title: Onboard ${{ parameters.name }} from the Quarkus golden path
        description: |
          Generated by Developer Hub from quarkus-rest-service v1.0.0.

          Application: https://github.com/box1-org/${{ parameters.name }}
          Owner: ${{ parameters.owner }}

          Installs PAC registration, scoped image/observation permissions, and the
          Argo CD Application with health probes, Route, Service, and ConfigMap.
          The initial Deployment stays at zero replicas until its first successful
          image promotion. After this PR is merged and Argo has reconciled,
          push the first application change to start delivery.
        sourcePath: gitops
        targetBranchName: main
    - id: register
      name: Register service in Developer Hub
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Application repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Review and merge GitOps onboarding
        url: ${{ steps.onboarding.output.remoteUrl }}
      - title: Open service in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: First delivery
        content: |
          Merge the onboarding PR, wait for Argo CD to reconcile, then push your
          first application change. The repository README has the exact steps.
          Subsequent main merges test, build, promote the digest, and deploy automatically.
