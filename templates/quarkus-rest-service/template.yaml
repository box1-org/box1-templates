apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: quarkus-rest-service
  title: Create Quarkus Service
  description: Java 21 REST service with automatic development provisioning, first build, and verified deployment.
  tags: [quarkus, java, tekton, openshift, golden-path]
  annotations:
    box1.org/template-version: "1.2.0"
spec:
  owner: user:default/mike4263
  type: service
  parameters:
    - title: Service details
      required: [name, description, owner, visibility]
      properties:
        name:
          title: Service and repository name
          type: string
          minLength: 3
          maxLength: 35
          pattern: '^(?!quarkus-reference$)(?!orders-service$)(?!rhdh$)(?!default$)(?!box1-)(?!openshift-)(?!kube-)[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
          description: Creates a repository and image with this name; development namespace and Route use <name>-dev.
        description:
          title: Description
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[A-Za-z0-9][A-Za-z0-9 .,!?()/_-]*$'
          default: A Quarkus REST service on OpenShift
        owner:
          title: Catalog owner
          type: string
          default: user:default/mike4263
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
        visibility:
          title: Repository visibility
          type: string
          enum: [private, public]
          default: private
        postgres:
          title: Include PostgreSQL support
          type: boolean
          default: false
          description: Add the Quarkus PostgreSQL JDBC extension for a service-owned database.
        kafka:
          title: Include Kafka support
          type: boolean
          default: false
          description: Add the Quarkus SmallRye Reactive Messaging Kafka extension.
  steps:
    - id: fetchApplication
      name: Generate application, tests, and pipelines
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: application
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.name }}-dev
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          postgres: ${{ parameters.postgres }}
          kafka: ${{ parameters.kafka }}
    - id: publish
      name: Create or resume source repository
      action: box1:repository:ensure
      input:
        name: ${{ parameters.name }}
        description: ${{ parameters.description }}
        owner: ${{ parameters.owner }}
        visibility: ${{ parameters.visibility }}
    - id: fetchGitops
      name: Generate GitOps onboarding configuration
      action: fetch:template
      input:
        url: ./gitops
        targetPath: gitops
        values:
          name: ${{ parameters.name }}
          namespace: ${{ parameters.name }}-dev
          sourceRevision: ${{ steps.publish.output.commitHash }}
          postgres: ${{ parameters.postgres }}
          kafka: ${{ parameters.kafka }}
    - id: catalogSubmit
      name: Submit service to the catalog
      action: box1:catalog:submit
      input:
        name: ${{ parameters.name }}
    - id: provision
      name: Provision and merge GitOps onboarding
      action: box1:development:provision
      input:
        name: ${{ parameters.name }}
        sourceRevision: ${{ steps.publish.output.commitHash }}
    - id: platform
      name: Synchronize and wait for platform readiness
      action: box1:development:platform
      input:
        name: ${{ parameters.name }}
        sourceRevision: ${{ steps.publish.output.commitHash }}
    - id: build
      name: Build the immutable first image
      action: box1:development:build
      input:
        name: ${{ parameters.name }}
        sourceRevision: ${{ steps.publish.output.commitHash }}
    - id: promote
      name: Promote the first image through GitOps
      action: box1:development:promote
      input:
        name: ${{ parameters.name }}
        sourceRevision: ${{ steps.publish.output.commitHash }}
    - id: verify
      name: Verify the deployed service
      action: box1:development:verify
      input:
        name: ${{ parameters.name }}
        sourceRevision: ${{ steps.publish.output.commitHash }}
    - id: catalogVerify
      name: Verify catalog processing
      action: box1:catalog:verify
      input:
        name: ${{ parameters.name }}
  output:
    links:
      - title: Source repository
        url: ${{ steps.verify.output.sourceUrl }}
      - title: Service in catalog
        icon: catalog
        entityRef: component:default/${{ parameters.name }}
      - title: Initial CI build
        url: ${{ steps.verify.output.pipelineUrl }}
      - title: Development deployment
        url: ${{ steps.verify.output.deploymentUrl }}
      - title: Argo CD Application
        url: ${{ steps.verify.output.argoUrl }}
      - title: Validated onboarding PR
        url: ${{ steps.verify.output.onboardingUrl }}
    text:
      - title: Development service is ready
        content: |
          The first image is built and deployed. No additional source push is needed.
          Subsequent main merges use the normal CI and development promotion pipeline.
          Onboarding status record: ${{ steps.verify.output.statusRecord }}.
