---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "${{ values.name }}"
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/box1-org/box1-gitops.git
    targetRevision: main
    path: workloads/${{ values.name }}
  destination:
    server: https://kubernetes.default.svc
    namespace: "${{ values.namespace }}"
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - PruneLast=true
