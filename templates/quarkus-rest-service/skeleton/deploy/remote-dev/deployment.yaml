apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}-remote-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # Resolve "${{ values.name }}:remote-dev" from the sandbox ImageStream that Jib pushes to.
        alpha.image.policy.openshift.io/resolve-names: "*"
        box1.org/jvm-debug: enabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: ${{ values.name }}:remote-dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUARKUS_LAUNCH_DEVMODE
              value: "true"
            - name: QUARKUS_LIVE_RELOAD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-remote-dev-live-reload
                  key: password
            # JDWP on localhost only: attach with `box1-debug sandbox` (oc port-forward).
            - name: _JAVA_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50.0 -Djava.io.tmpdir=/tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            # Remote dev rewrites the application jars in place, so unlike the
            # Argo-managed Deployment the root filesystem stays writable here.
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
