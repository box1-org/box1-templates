# Builds and inspects the OCI image without registry, GitOps, or cluster credentials.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: box1-onboarding-plugin-pr-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/on-path-change: "[plugins/box1-onboarding/**, scripts/**, tools/rhdh-cli/**, .tekton/**, package.json, package-lock.json]"
spec:
  taskRunTemplate:
    serviceAccountName: ci-plugin-check
  timeouts:
    pipeline: 20m
  pipelineSpec:
    tasks:
      - name: onboarding-plugin
        # PAC can briefly create the run before its event credential Secret.
        retries: 1
        taskSpec:
          volumes:
            - name: workspace
              emptyDir: {}
            - name: containers
              emptyDir: {}
          stepTemplate:
            image: registry.access.redhat.com/ubi9/buildah@sha256:12ab6d225aef49ceed4c7b39e7ab207c4b7f4a67b7dba04a61efbac92c01b8b8
            workingDir: /workspace/source
            securityContext:
              runAsUser: 0
              capabilities:
                add: [SETFCAP]
            computeResources:
              requests: {cpu: 500m, memory: 1Gi}
              limits: {cpu: "2", memory: 3Gi}
            env:
              - name: HOME
                value: /workspace/home
              - name: REVISION
                value: "{{revision}}"
              - name: PATH
                value: /workspace/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              - name: BUILDAH_ISOLATION
                value: chroot
              - name: STORAGE_DRIVER
                value: vfs
              - name: BUILDAH_FORMAT
                value: oci
            volumeMounts:
              - name: workspace
                mountPath: /workspace
              - name: containers
                mountPath: /var/lib/containers
          steps:
            - name: fetch
              workingDir: /workspace
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "{{git_auth_secret}}"
                      key: git-provider-token
              script: |
                #!/bin/sh
                set -eu
                echo "$REVISION" | grep -Eq '^[a-f0-9]{40}$'
                mkdir -p source home node
                curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
                  "https://api.github.com/repos/box1-org/box1-templates/tarball/$REVISION" \
                  | tar -xz --strip-components=1 -C source
                # Platform-owned checksum, independent of the source under test.
                curl -fsSL -o node.tar.gz https://nodejs.org/dist/v22.21.1/node-v22.21.1-linux-x64.tar.gz
                echo '219a152ea859861d75adea578bdec3dce8143853c13c5187f40c40e77b0143b2  node.tar.gz' | sha256sum -c -
                tar -xzf node.tar.gz --strip-components=1 -C node
                rm node.tar.gz
                printf 'Fetched box1-templates at %s\n' "$REVISION"
            - name: test
              script: |
                #!/bin/sh
                set -eu
                npm ci --no-audit --no-fund
                npm ci --prefix tools/rhdh-cli --ignore-scripts --no-audit --no-fund
                npm run validate
                npm run test:onboarding
                npm run test:onboarding-oci
            - name: package-and-inspect
              script: |
                #!/bin/sh
                set -eu
                image=localhost/box1-onboarding-plugin:pr
                BUILD_URL=local npm run package:onboarding-oci -- --tag "$image" --container-tool buildah
                buildah push "$image" oci:/workspace/layout
                node scripts/inspect-onboarding-oci.mjs --layout /workspace/layout --revision "$REVISION"
