apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: box1-software-templates
  description: Box1 platform-owned software templates
spec:
  type: url
  targets:
    - ./templates/quarkus-rest-service/template.yaml
    - ./templates/github-repository/template.yaml
    - ./templates/rhel-image-vm/template.yaml
    - ./templates/quarkus-monorepo/template.yaml
    - ./templates/vm-instance/template.yaml
    - ./templates/gitlab-proof-service/template.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: box1-templates
  description: Box1 software templates and the Developer Hub onboarding plugin
  annotations:
    github.com/project-slug: box1-org/box1-templates
  tags: [repository, backstage, software-templates]
spec:
  type: repository
  lifecycle: experimental
  owner: user:default/mike
